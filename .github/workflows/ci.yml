name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore
        run: dotnet restore CaveAiProForWindows.sln

      - name: Test
        run: dotnet test tests/CaveAiProForWindows.Tests/CaveAiProForWindows.Tests.csproj -c Debug --no-restore --verbosity minimal

  release-build-publish:
    runs-on: windows-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore
        run: dotnet restore CaveAiProForWindows.sln

      - name: Build (Release, obfuscated)
        run: dotnet build src/CaveAiProForWindows/CaveAiProForWindows.csproj -c Release --no-restore

      - name: Publish + smoke test
        shell: pwsh
        run: ./tools/smoke-publish.ps1 -SkipTests -LaunchSmokeTest -SmokeSeconds 10

      - name: Upload published exe
        uses: actions/upload-artifact@v4
        with:
          name: CaveAiProForWindows-win-x64
          path: src/CaveAiProForWindows/bin/Release/net8.0-windows/publish/win-x64/CaveAiProForWindows.exe
          if-no-files-found: error
          retention-days: 14
