name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore
        run: dotnet restore CaveAiProForWindows.sln

      - name: Test
        run: dotnet test tests/CaveAiProForWindows.Tests/CaveAiProForWindows.Tests.csproj -c Debug --no-restore --verbosity minimal

      - name: Build and test (Microsoft Store configuration)
        run: |
          dotnet build src/CaveAiProForWindows/CaveAiProForWindows.csproj -c Debug /p:DefineConstants=STORE_DISTRIBUTION
          dotnet test tests/CaveAiProForWindows.Tests/CaveAiProForWindows.Tests.csproj -c Debug /p:DefineConstants=STORE_DISTRIBUTION --verbosity minimal

      - name: Security audit
        shell: pwsh
        run: ./tools/security-audit.ps1

      - name: Verify Firestore rules stub (do not deploy from Windows repo)
        shell: pwsh
        run: ./tools/verify-firestore-rules-stub.ps1

  release-build-publish:
    runs-on: windows-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore
        run: dotnet restore CaveAiProForWindows.sln

      - name: Inject Firebase web config (required for Release verify)
        shell: pwsh
        env:
          CAVEAIPRO_FIREBASE_API_KEY: ${{ secrets.CAVEAIPRO_FIREBASE_API_KEY }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:CAVEAIPRO_FIREBASE_API_KEY)) {
            throw 'CI Release build requires GitHub secret CAVEAIPRO_FIREBASE_API_KEY (Firebase Web API key).'
          }
          ./tools/inject-firebase-config.ps1

      - name: Build (Release, obfuscated)
        run: dotnet build src/CaveAiProForWindows/CaveAiProForWindows.csproj -c Release --no-restore

      - name: Publish + smoke test
        shell: pwsh
        env:
          CAVEAIPRO_FIREBASE_API_KEY: ${{ secrets.CAVEAIPRO_FIREBASE_API_KEY }}
        run: ./tools/smoke-publish.ps1 -SkipTests -NoRestore -LaunchSmokeTest -SmokeSeconds 10

      - name: Restore firebase-config placeholder in source
        if: always()
        shell: pwsh
        run: ./tools/restore-firebase-config-placeholder.ps1

      - name: Upload published exe
        uses: actions/upload-artifact@v4
        with:
          name: CaveAiProForWindows-win-x64
          path: src/CaveAiProForWindows/bin/Release/net8.0-windows/publish/win-x64/CaveAiProForWindows.exe
          if-no-files-found: error
          retention-days: 14
