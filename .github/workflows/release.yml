# Release pipeline: tag push → build/test → publish → sign → package → GitHub Release assets.
#
# Assets per release:
#   - CaveAiProForWindows-{tag}-win-x64.zip        (portable single-file exe)
#   - CaveAiProForWindows-{tag}-Setup.msi          (WiX per-machine installer, InstallationGuard)
#   - CaveAiProForWindows-{tag}-Setup.exe          (Velopack installer)
#   - Velopack delta packages (*.nupkg + releases.win.json) for in-app auto-update
#
# Optional GitHub secrets:
#   WINDOWS_CERT_BASE64   — Authenticode PFX (base64)
#   WINDOWS_CERT_PASSWORD — PFX password
#   CAVEAIPRO_FIREBASE_API_KEY — required; baked into bundled desktop auth at build time
#
# Manual dry run: Actions → Release → Run workflow

name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      dry_run_tag:
        description: "Tag label for artifact names (workflow_dispatch only)"
        required: false
        default: "v0.0.0-manual"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Resolve release tag
        id: tag
        shell: pwsh
        run: |
          $tag = if ('${{ github.ref_type }}' -eq 'tag') { '${{ github.ref_name }}' } else { '${{ inputs.dry_run_tag }}' }
          "tag=$tag" >> $env:GITHUB_OUTPUT

      - name: Inject Firebase web config (required for release)
        shell: pwsh
        env:
          CAVEAIPRO_FIREBASE_API_KEY: ${{ secrets.CAVEAIPRO_FIREBASE_API_KEY }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:CAVEAIPRO_FIREBASE_API_KEY)) {
            throw 'Release builds require GitHub secret CAVEAIPRO_FIREBASE_API_KEY (Firebase Web API key).'
          }
          ./tools/inject-firebase-config.ps1
          # inject-firebase-config.ps1 runs verify-firebase-config.ps1 after writing

      - name: Restore
        run: dotnet restore CaveAiProForWindows.sln

      - name: Build (Release, obfuscated)
        run: dotnet build src/CaveAiProForWindows/CaveAiProForWindows.csproj -c Release --no-restore

      - name: Test (full suite, no filter)
        run: dotnet test tests/CaveAiProForWindows.Tests/CaveAiProForWindows.Tests.csproj -c Debug --no-restore --verbosity minimal

      - name: Publish + smoke test
        shell: pwsh
        run: ./tools/smoke-publish.ps1 -SkipTests -LaunchSmokeTest -SmokeSeconds 10

      - name: Code sign published exe (optional)
        shell: pwsh
        env:
          WINDOWS_CERT_BASE64: ${{ secrets.WINDOWS_CERT_BASE64 }}
          WINDOWS_CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        run: |
          $exe = Join-Path $PWD 'src/CaveAiProForWindows/bin/Release/net8.0-windows/publish/win-x64/CaveAiProForWindows.exe'
          ./tools/sign-release.ps1 -Files $exe

      - name: Package ZIP, MSI, and Velopack
        id: package
        shell: pwsh
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: ./tools/package-release.ps1 -Tag $env:TAG

      - name: Code sign release installers (optional)
        shell: pwsh
        env:
          WINDOWS_CERT_BASE64: ${{ secrets.WINDOWS_CERT_BASE64 }}
          WINDOWS_CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        run: |
          ./tools/sign-release.ps1 -Files @(
            '${{ steps.package.outputs.msi_path }}',
            '${{ steps.package.outputs.setup_path }}'
          )

      - name: Prepare release notes body
        if: github.ref_type == 'tag'
        id: changelog
        shell: pwsh
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          $version = $env:TAG -replace '^v',''
          $body = ./tools/extract-changelog-section.ps1 -Version $version
          "body<<EOF" >> $env:GITHUB_OUTPUT
          $body >> $env:GITHUB_OUTPUT
          "EOF" >> $env:GITHUB_OUTPUT

      - name: Warn when code signing secrets missing (tag release)
        if: github.ref_type == 'tag'
        shell: pwsh
        env:
          WINDOWS_CERT_BASE64: ${{ secrets.WINDOWS_CERT_BASE64 }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:WINDOWS_CERT_BASE64)) {
            Write-Warning 'WINDOWS_CERT_BASE64 is not configured — release artifacts will be UNSIGNED.'
            Write-Warning 'See docs/CODE-SIGNING.md to configure Authenticode signing.'
          }

      - name: Create GitHub Release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          body: ${{ steps.changelog.outputs.body }}
          generate_release_notes: false
          files: _release_out/**/*

      - name: Upload workflow_dispatch artifacts
        if: github.ref_type != 'tag'
        uses: actions/upload-artifact@v4
        with:
          name: release-package-${{ steps.tag.outputs.tag }}
          path: _release_out/**/*
          if-no-files-found: error

      - name: Restore firebase-config placeholder in source
        if: always()
        shell: pwsh
        run: ./tools/restore-firebase-config-placeholder.ps1
